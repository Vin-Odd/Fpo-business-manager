name: fpo_business_manager
description: FPO business management app — sales, inventory, invoicing.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Local database (SQLite via drift)
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0
  uuid: ^4.4.2

  # Sync layer (local-first + push to backend once one exists)
  dio: ^5.5.0
  connectivity_plus: ^6.0.5

  # Formatting
  intl: ^0.19.0

  # PDF invoice generation (wired up in a later phase)
  pdf: ^3.11.0
  printing: ^5.13.1
  share_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  drift_dev: ^2.20.0

flutter:
  uses-material-design: true
